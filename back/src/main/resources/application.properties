# ══════════════════════════════════════════════════════
#  GQG System - Backend Spring Boot
#  Conexión a Supabase PostgreSQL vía JDBC directo
# ══════════════════════════════════════════════════════

# Supabase → Settings → Database → Connection string (JDBC)
# Reemplazá [YOUR-PASSWORD] con tu contraseña de Supabase
spring.datasource.url=jdbc:postgresql://db.emovktvnrdhsxjbohbfe.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=TU_PASSWORD_SUPABASE
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor (cambiá si necesitás otro)
server.port=8080

# Para que los JSON con fechas salgan en formato correcto
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
